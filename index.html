<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マーケティング・ボトルネック診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-6 md:py-10">
    <header class="text-center mb-6 md:mb-10">
      <p class="inline-block px-3 py-1 text-sm rounded-full bg-indigo-100 text-indigo-700 mb-3">MVP 診断アプリ</p>
      <h1 class="text-2xl md:text-4xl font-extrabold">あなたのマーケティング<br class="md:hidden">ボトルネック診断</h1>
      <p class="text-slate-600 mt-3">初心者でも3〜5分で、今の課題と次の一歩が見える診断です。</p>
    </header>

    <div class="bg-white rounded-2xl shadow p-4 md:p-6">
      <div class="mb-4">
        <div class="flex justify-between text-sm mb-1">
          <span id="progressLabel">開始前</span>
          <span id="progressText">0%</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5">
          <div id="progressBar" class="h-2.5 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500" style="width: 0%"></div>
        </div>
      </div>

      <main id="app"></main>
    </div>
  </div>

<script>
const CATEGORY_META = [
  { key: 'audience', name: '誰に届けるか', desc: 'まずは「誰のどんな悩み」を解決するかを確認します。' },
  { key: 'outcome', name: 'どんな変化を届けるか', desc: 'サービスで起きる変化を言葉にできるかを見ます。' },
  { key: 'traffic', name: '発信・集客', desc: '見込み客に見つけてもらう仕組みを確認します。' },
  { key: 'trust', name: '信頼づくり', desc: '実績や発信で安心感を作れているかを見ます。' },
  { key: 'experience', name: '体験の場（セミナー・相談・フロント）', desc: '初回体験の導線と満足度を確認します。' },
  { key: 'sales', name: 'お申し込み・セールス', desc: '申込みまで迷わせない設計かを見ます。' },
  { key: 'retention', name: '提供後の成果・継続・紹介', desc: '提供後の価値最大化の仕組みを確認します。' },
  { key: 'clarity', name: 'サービス内容の明確さ', desc: '内容や価格のわかりやすさを診断します。' },
];

const SCALE_LABELS = [
  { value: 1, text: '1 = まったくできていない' },
  { value: 2, text: '2 = あまりできていない' },
  { value: 3, text: '3 = どちらともいえない' },
  { value: 4, text: '4 = ある程度できている' },
  { value: 5, text: '5 = しっかりできている' },
];

const QUESTIONS = [
  ['audience', 'どんな人に届けたいかを、ひとことで説明できますか？'],
  ['audience', '理想のお客様の悩みを、具体的に3つ言えますか？'],
  ['audience', 'お客様が「今すぐ解決したい」と感じる課題を把握していますか？'],
  ['outcome', 'あなたのサービスで得られる変化を、わかりやすく伝えられますか？'],
  ['outcome', '受講・利用前後の違いを、具体例で話せますか？'],
  ['outcome', '似たサービスとの違いを、やさしい言葉で説明できますか？'],
  ['traffic', '発信するテーマが毎回ぶれずに統一されていますか？'],
  ['traffic', '見込み客が見つけやすい場所（SNS/検索/紹介導線）がありますか？'],
  ['traffic', '毎週の発信や集客行動を、無理なく継続できていますか？'],
  ['trust', 'お客様の声や実績を、見える形で紹介できていますか？'],
  ['trust', '自己紹介・想い・実績が、初めての人にも伝わりますか？'],
  ['trust', '発信内容に一貫性があり「この人なら安心」と感じてもらえていますか？'],
  ['experience', '初回体験（説明会/相談）に自然につながる導線がありますか？'],
  ['experience', '体験の場で、相手の悩みを丁寧に整理できていますか？'],
  ['experience', '体験の満足度を上げる工夫（資料・進行・フォロー）がありますか？'],
  ['sales', '価格・内容・期間を、迷わず伝えられますか？'],
  ['sales', 'お申し込み方法がシンプルで、途中で迷わない設計ですか？'],
  ['sales', '検討中の方へのフォロー（質問対応・再案内）ができていますか？'],
  ['retention', '提供後に成果を確認する仕組み（面談/アンケート）がありますか？'],
  ['retention', '継続提案や次のステップを、自然に案内できていますか？'],
  ['retention', '紹介が生まれる工夫（紹介しやすい導線・依頼）ができていますか？'],
  ['clarity', 'サービスの範囲（何をする/しない）が明確ですか？'],
  ['clarity', '料金に含まれる内容を、誤解なく伝えられますか？'],
  ['clarity', 'お客様が比較しやすい形で、プランを整理できていますか？'],
].map((q, i) => ({ id: `q${i+1}`, category: q[0], text: q[1] }));

const TYPE_COPY = {
  lost: {
    name: '迷子タイプ',
    summary: 'がんばっているのに、どこから整えるべきかが見えづらい状態です。まずは土台を一緒に整えましょう。',
    next: ['理想のお客様を1人に絞って言語化', 'サービスの変化を1文で定義', '週1回の発信テーマを固定'],
  },
  overwork: {
    name: 'がんばりすぎタイプ',
    summary: '発信や努力は十分ですが、申込み導線や体験設計で取りこぼしが起きやすい状態です。',
    next: ['体験から申込みまでの手順を3ステップ化', '申込みページを1画面で完結させる', 'よくある質問テンプレを作る'],
  },
  close: {
    name: '惜しいタイプ',
    summary: '全体は整っており、あと少しで安定して成果が出る状態です。弱点カテゴリを集中改善しましょう。',
    next: ['下位2カテゴリに2週間集中', '実績の見せ方を改善', 'オファー文を短く明確化'],
  },
  natural: {
    name: '自然に売れるタイプ',
    summary: '導線と価値提供がきれいに連動しています。再現性を高め、仕組み化フェーズに進みましょう。',
    next: ['成功プロセスをテンプレ化', '紹介導線を強化', '新チャネルをテスト'],
  },
};

const AI_ADVICE = {
  lost: [
    'ChatGPT: お客様像の整理。メモを渡して「理想顧客を1人に絞る」質問を作る。',
    'Gemini: 同業の発信を比較し、差別化のヒントを探す。',
    'NotebookLM: 自分の講座資料を読み込ませ、強みと不足を見える化。',
    'Genspark: 初心者向けの発信ネタを一気に広げる。',
  ],
  overwork: [
    'ChatGPT: 体験会〜申込みの会話スクリプトを作る。',
    'Gemini: 離脱ポイントの仮説を複数出してもらう。',
    'NotebookLM: 面談メモから断られる理由の共通点を抽出。',
    'Genspark: 提案資料の構成案を複数比較。',
  ],
  close: [
    'ChatGPT: 下位カテゴリの改善タスクを週次化。',
    'Gemini: 最新施策の参考パターン収集。',
    'NotebookLM: 過去成功事例の再利用ポイント抽出。',
    'Genspark: LPや募集文の比較案を作成。',
  ],
  natural: [
    'ChatGPT: オペレーション標準化マニュアル作成。',
    'Gemini: 新規チャネル候補を優先順位付け。',
    'NotebookLM: 成功事例を教材化し、チームで共有。',
    'Genspark: 上位商品や継続商品アイデア生成。',
  ],
};

const state = {
  step: 'intro',
  profile: {},
  index: 0,
  answers: {},
  charts: [],
};

const app = document.getElementById('app');

function render() {
  updateProgress();
  if (state.step === 'intro') return renderIntro();
  if (state.step === 'profile') return renderProfile();
  if (state.step === 'question') return renderQuestion();
  if (state.step === 'result') return renderResult();
}

function updateProgress() {
  let ratio = 0;
  let label = '開始前';
  if (state.step === 'profile') { ratio = 10; label = '基本情報の入力'; }
  if (state.step === 'question') {
    ratio = 10 + Math.floor((Object.keys(state.answers).length / QUESTIONS.length) * 80);
    label = `診断中 ${state.index + 1}/${QUESTIONS.length}`;
  }
  if (state.step === 'result') { ratio = 100; label = '結果表示'; }
  document.getElementById('progressBar').style.width = `${ratio}%`;
  document.getElementById('progressText').textContent = `${ratio}%`;
  document.getElementById('progressLabel').textContent = label;
}

function renderIntro() {
  app.innerHTML = `
    <section class="text-center py-6">
      <div class="text-5xl mb-4">🚀</div>
      <h2 class="text-xl md:text-2xl font-bold mb-2">3〜5分で診断できます</h2>
      <p class="text-slate-600 mb-6">あなたの強みと、売上を止めているボトルネックを見つけます。</p>
      <button id="startBtn" class="w-full md:w-auto px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700">診断をはじめる</button>
    </section>
  `;
  document.getElementById('startBtn').onclick = () => { state.step = 'profile'; render(); };
}

function renderProfile() {
  app.innerHTML = `
    <section>
      <h2 class="text-lg font-bold mb-1">はじめに基本情報を入力してください</h2>
      <p class="text-slate-600 text-sm mb-4">結果の精度向上と、今後の改善提案に使います。</p>
      <form id="profileForm" class="space-y-3">
        <input required name="name" placeholder="お名前" class="w-full border rounded-lg px-3 py-2" />
        <input required type="email" name="email" placeholder="メールアドレス" class="w-full border rounded-lg px-3 py-2" />
        <textarea required name="serviceDescription" placeholder="どんなサービスをしていますか？" class="w-full border rounded-lg px-3 py-2"></textarea>
        <input required name="industryCategory" placeholder="業種カテゴリ（例: キャリア支援、英語、ダイエット）" class="w-full border rounded-lg px-3 py-2" />
        <select required name="deliveryFormat" class="w-full border rounded-lg px-3 py-2">
          <option value="">主な提供形態を選択</option>
          <option>講座</option><option>コンサル</option><option>コーチング</option><option>コミュニティ</option><option>代行</option><option>その他</option>
        </select>
        <fieldset class="border rounded-lg p-3">
          <legend class="text-sm px-1">現在の集客方法（複数選択可）</legend>
          <div class="grid grid-cols-2 gap-2 text-sm">
            ${['SNS','紹介','広告','LINE','メルマガ','その他'].map(v => `<label><input type="checkbox" name="acq" value="${v}" class="mr-1">${v}</label>`).join('')}
          </div>
        </fieldset>
        <select name="revenueStage" class="w-full border rounded-lg px-3 py-2">
          <option value="">売上ステージ（任意）</option>
          <option>まだ売れていない</option><option>月商10万未満</option><option>10〜30万</option><option>30〜100万</option><option>100万以上</option>
        </select>
        <button class="w-full px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold">質問へ進む</button>
      </form>
    </section>
  `;
  document.getElementById('profileForm').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    state.profile = {
      name: fd.get('name'),
      email: fd.get('email'),
      serviceDescription: fd.get('serviceDescription'),
      industryCategory: fd.get('industryCategory'),
      deliveryFormat: fd.get('deliveryFormat'),
      acquisitionChannels: fd.getAll('acq'),
      revenueStage: fd.get('revenueStage') || null,
    };
    state.step = 'question';
    render();
  }
}

function renderQuestion() {
  const q = QUESTIONS[state.index];
  const cat = CATEGORY_META.find(c => c.key === q.category);
  app.innerHTML = `
    <section>
      <div class="mb-4 p-3 bg-indigo-50 rounded-xl">
        <p class="text-sm text-indigo-700 font-semibold">${cat.name}</p>
        <p class="text-sm text-slate-600">${cat.desc}</p>
      </div>
      <h3 class="text-lg font-bold mb-3">${q.text}</h3>
      <div class="space-y-2 mb-4">
        ${SCALE_LABELS.map(s => `<button data-v="${s.value}" class="ans w-full text-left border rounded-xl px-3 py-2 hover:bg-indigo-50 ${state.answers[q.id] === s.value ? 'bg-indigo-100 border-indigo-400' : ''}">${s.text}</button>`).join('')}
      </div>
      <div class="flex gap-2">
        <button id="prevBtn" class="flex-1 border rounded-xl px-3 py-2 ${state.index === 0 ? 'opacity-40 cursor-not-allowed' : ''}">戻る</button>
        <button id="nextBtn" class="flex-1 rounded-xl px-3 py-2 text-white ${state.answers[q.id] ? 'bg-indigo-600' : 'bg-slate-400'}">${state.index === QUESTIONS.length - 1 ? '結果を見る' : '次へ'}</button>
      </div>
    </section>
  `;
  document.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    state.answers[q.id] = Number(b.dataset.v);
    render();
  });
  document.getElementById('prevBtn').onclick = () => {
    if (state.index > 0) { state.index--; render(); }
  };
  document.getElementById('nextBtn').onclick = async () => {
    if (!state.answers[q.id]) return;
    if (state.index < QUESTIONS.length - 1) {
      state.index++;
      render();
    } else {
      state.step = 'result';
      await persist();
      render();
    }
  };
}

function evaluate() {
  const categoryRaw = Object.fromEntries(CATEGORY_META.map(c => [c.key, 0]));
  const categoryCount = Object.fromEntries(CATEGORY_META.map(c => [c.key, 0]));
  QUESTIONS.forEach(q => {
    const v = state.answers[q.id] || 0;
    categoryRaw[q.category] += v;
    categoryCount[q.category] += 1;
  });

  const categoryScore = {};
  for (const key of Object.keys(categoryRaw)) {
    categoryScore[key] = Math.round((categoryRaw[key] / (categoryCount[key] * 5)) * 100);
  }

  const total = Object.values(state.answers).reduce((a, b) => a + b, 0);
  const normalized = Math.round((total / (QUESTIONS.length * 5)) * 100);

  const ordered = Object.entries(categoryScore).sort((a, b) => b[1] - a[1]);
  const strengths = ordered.slice(0, 2);
  const bottlenecks = [...ordered].reverse().slice(0, 2);
  const weakCount = Object.values(categoryScore).filter(v => v < 60).length;

  let type = 'lost';
  if (normalized >= 75 && Object.values(categoryScore).every(v => v >= 60)) type = 'natural';
  else if (normalized >= 45 && categoryScore.traffic >= 70 && (categoryScore.experience < 55 || categoryScore.sales < 55)) type = 'overwork';
  else if (normalized >= 60 && weakCount <= 2) type = 'close';

  return { total, normalized, categoryScore, strengths, bottlenecks, type };
}

function renderResult() {
  const result = evaluate();
  const copy = TYPE_COPY[result.type];
  const advice = AI_ADVICE[result.type];

  app.innerHTML = `
    <section>
      <div class="text-center mb-4">
        <h2 class="text-2xl font-extrabold">${copy.name}</h2>
        <p class="text-slate-600 mt-1">${copy.summary}</p>
        <p class="text-3xl font-black mt-3 text-indigo-600">合計 ${result.total} / 120点</p>
      </div>

      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div class="border rounded-xl p-3"><canvas id="radarChart" height="220"></canvas></div>
        <div class="border rounded-xl p-3"><canvas id="barChart" height="220"></canvas></div>
      </div>

      <div class="grid md:grid-cols-2 gap-3 mb-4">
        <div class="bg-emerald-50 rounded-xl p-3">
          <h3 class="font-bold mb-2">強み</h3>
          <ul class="text-sm list-disc ml-5">${result.strengths.map(([k,v]) => `<li>${labelByKey(k)}: ${v}点</li>`).join('')}</ul>
        </div>
        <div class="bg-rose-50 rounded-xl p-3">
          <h3 class="font-bold mb-2">ボトルネック</h3>
          <ul class="text-sm list-disc ml-5">${result.bottlenecks.map(([k,v]) => `<li>${labelByKey(k)}: ${v}点</li>`).join('')}</ul>
        </div>
      </div>

      <div class="bg-indigo-50 rounded-xl p-3 mb-3">
        <h3 class="font-bold mb-2">おすすめの次アクション</h3>
        <ul class="text-sm list-disc ml-5">${copy.next.map(v => `<li>${v}</li>`).join('')}</ul>
      </div>

      <div class="bg-slate-100 rounded-xl p-3 mb-4">
        <h3 class="font-bold mb-2">AI活用アドバイス（初心者向け）</h3>
        <ul class="text-sm list-disc ml-5">${advice.map(v => `<li>${v}</li>`).join('')}</ul>
      </div>

      <button id="retryBtn" class="w-full rounded-xl px-4 py-3 bg-indigo-600 text-white font-bold">もう一度診断する</button>
    </section>
  `;

  drawCharts(result.categoryScore);
  document.getElementById('retryBtn').onclick = () => {
    state.step = 'intro';
    state.index = 0;
    state.answers = {};
    state.profile = {};
    state.charts.forEach(c => c.destroy());
    state.charts = [];
    render();
  };
}

function drawCharts(scores) {
  state.charts.forEach(c => c.destroy());
  state.charts = [];

  const labels = CATEGORY_META.map(c => c.name);
  const data = CATEGORY_META.map(c => scores[c.key]);

  const radar = new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: { labels, datasets: [{ label: 'カテゴリスコア', data, backgroundColor: 'rgba(99,102,241,0.2)', borderColor: 'rgba(99,102,241,1)' }] },
    options: { scales: { r: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });

  const bar = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'スコア', data, backgroundColor: 'rgba(16,185,129,0.7)' }] },
    options: { scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
  });

  state.charts.push(radar, bar);
}

function labelByKey(key) {
  return CATEGORY_META.find(c => c.key === key)?.name || key;
}

async function persist() {
  const result = evaluate();
  const payload = {
    profile: state.profile,
    answers: state.answers,
    categoryScore: result.categoryScore,
    totalScore: result.total,
    normalizedScore: result.normalized,
    typeResult: TYPE_COPY[result.type].name,
    resultComment: TYPE_COPY[result.type].summary,
    strengths: result.strengths,
    bottlenecks: result.bottlenecks,
  };

  try {
    await fetch('http://localhost:3000/api/diagnosis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (_) {
    localStorage.setItem(`diagnosis_${Date.now()}`, JSON.stringify(payload));
  }
}

render();
</script>
</body>
</html>
